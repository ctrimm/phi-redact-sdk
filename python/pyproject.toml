[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-redact"
version = "0.6.0"
description = "Compact on-device PII/PHI redaction: deterministic rules layer plus optional ONNX neural model"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Cory Trimm" }]
keywords = ["pii", "phi", "redaction", "de-identification", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Neural layer (names, addresses, free-text PHI). Rules-only needs nothing.
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15"]

[tool.setuptools]
# phi_redact is the SDK; redact/ is the deterministic rules layer it wraps.
packages = ["phi_redact", "phi_redact.integrations", "redact"]

[tool.setuptools.package-dir]
phi_redact = "phi_redact"
redact = "redact"
